[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-alarm-copilot"
version = "0.1.0"
description = "以 ALPI 資料集建立的工業警報分析、檢索與預測應用"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    'scikit-learn>=1.5,<2.0',
    'scipy>=1.13,<2.0',
    "pandas>=2.2,<3.0",
    "pyarrow>=15,<30",
    "plotly>=6.9,<7.0",
    "streamlit>=1.60,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
sequence = [
    "torch>=2.11,<2.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
