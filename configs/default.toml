[incidents]
gap_minutes = 30
sensitivity_gap_minutes = [15, 30, 60]

[baselines]
quantile = 0.95
minimum_incident_count = 200

[retrieval]
top_k = 5
alarm_weight = 1.0
shape_weight = 1.0
candidate_policy = 'expanding_history'
future_horizon_hours_candidates = [1, 6, 24]
relevance_threshold_candidates = [0.1, 0.3, 0.5]
selected_feature_version = 'alarm_plus_shape_v1'
future_horizon_hours = 6
relevance_threshold = 0.3

[forecasting]
top_k = 5
forecast_horizon_hours_candidates = [1, 6, 24]
selected_forecast_horizon_hours = 6
rare_max_train_support = 49
common_min_train_support = 500
minimum_machine_train_samples = 200
minimum_transition_train_samples = 20
linear_c = 1.0
linear_max_iter = 300
linear_class_weight_candidates = ['none', 'balanced']

[split]
strategy = "per_machine_unique_timestamp"
train_ratio = 0.70
validation_ratio = 0.15
test_ratio = 0.15
